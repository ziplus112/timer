<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151925"><title>Neumorphic Timer</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#151925;font-family:Tahoma,Segoe UI,sans-serif;color:#626a78}.app{width:min(100%,430px);min-height:820px;padding:26px;background:#eef1f7;border-radius:34px;box-shadow:0 24px 60px #090c14;text-align:center}.header{display:flex;justify-content:space-between}.btn,.tab,input{border:0;background:#eef1f7;box-shadow:8px 8px 18px #d3d7df,-8px -8px 18px #fff}.btn{width:48px;height:48px;border-radius:15px;font-size:22px}.tabs{display:flex;gap:6px;margin:24px 0;padding:6px;border-radius:28px;box-shadow:inset 8px 8px 18px #d5d9e1,inset -8px -8px 18px #fff}.tab{flex:1;height:38px;border-radius:20px;color:#8b929e}.active{color:#666;background:#f8faff;box-shadow:5px 5px 12px #d8dce4,-5px -5px 12px #fff}.clock{width:290px;height:290px;margin:15px auto 35px;border-radius:50%;display:grid;place-items:center;background:#eef1f7;box-shadow:12px 12px 28px #d3d7df,-10px -10px 24px #fff;position:relative}.inner{width:76%;height:76%;border-radius:50%;box-shadow:inset 8px 8px 18px #d5d9e1,inset -8px -8px 18px #fff}.time{position:absolute;width:180px;height:76px;border-radius:40px;display:grid;place-items:center;font-size:40px;box-shadow:12px 12px 28px #d3d7df,-10px -10px 24px #fff;cursor:pointer}.date{font-size:12px;margin-top:-20px}.fab{margin-top:25px;width:60px;height:60px;border:0;border-radius:50%;font-size:34px;color:white;background:#09afe9}.panel{display:none;position:fixed;inset:0;background:#10141fcc;place-items:end center}.panel.open{display:grid}.modal{width:min(100%,430px);padding:25px;background:#eef1f7;border-radius:30px 30px 0 0}.row{display:flex;gap:8px;align-items:center}.row input{width:100%;padding:14px;border-radius:16px;text-align:center;font-size:20px}.primary,.secondary{border:0;border-radius:16px;padding:13px 20px;margin-top:20px}.primary{background:#09afe9;color:#fff}.secondary{background:#eef1f7}.status{font-size:12px;color:#08aeea;margin-top:10px}@media(max-width:600px){.app{min-height:100vh;border-radius:0}.clock{width:260px;height:260px}}</style></head><body><main class="app"><div class="header"><button class="btn" id="back">‹</button><button class="btn" id="settings">⚙</button></div><div class="tabs"><button class="tab active" data-mode="alarm">آلارم</button><button class="tab" data-mode="timer">تایمر</button><button class="tab" data-mode="sleep">خواب</button></div><div class="clock"><div class="inner"></div></div><div class="time" id="time">15:30</div><div class="date" id="date"></div><div class="status" id="status"></div><div class="tabs"><button class="tab active">روزانه</button><button class="tab">هفتگی</button><button class="tab">ماهانه</button></div><button class="fab" id="add">+</button></main><div class="panel" id="panel"><div class="modal"><h2>تنظیم تایمر</h2><div class="row"><input id="min" type="number" min="0" value="15"><span>دقیقه</span><input id="sec" type="number" min="0" max="59" value="30"><span>ثانیه</span></div><button class="secondary" id="close">انصراف</button><button class="primary" id="start">شروع</button></div></div><script>
let remaining=Number(localStorage.timerRemaining)||930,running=false,id=null,mode='alarm';const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');function render(){$('#time').textContent=pad(Math.floor(remaining/60))+':'+pad(remaining%60);$('#status').textContent=mode==='timer'?(running?'در حال شمارش معکوس':'برای تنظیم تایمر روی + بزنید'):'';localStorage.timerRemaining=remaining}function tick(){if(remaining<=0){clearInterval(id);id=null;running=false;$('#status').textContent='⏰ زمان به پایان رسید';return}remaining--;render()}function startTimer(){if(running)return;running=true;render();id=setInterval(tick,1000)}function stopTimer(){clearInterval(id);id=null;running=false;render()}function open(){ $('#min').value=Math.floor(remaining/60);$('#sec').value=remaining%60;$('#panel').classList.add('open')}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;render()});$('#add').onclick=open;$('#time').onclick=()=>mode==='timer'&&(running?stopTimer():startTimer());$('#close').onclick=()=>$('#panel').classList.remove('open');$('#start').onclick=()=>{remaining=(+$('#min').value||0)*60+(+$('#sec').value||0);mode='timer';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode==='timer'));$('#panel').classList.remove('open');startTimer()};$('#settings').onclick=()=>alert('تنظیمات در نسخه بعدی توسعه داده می‌شود.');$('#back').onclick=()=>running?stopTimer():history.back();$('#date').textContent=new Date().toLocaleDateString('fa-IR');render();
</script></body></html>
